<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dipankar - Angular Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio of Dipankar - Angular Developer specializing in scalable enterprise applications">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Handle client-side routing for production deployment
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
